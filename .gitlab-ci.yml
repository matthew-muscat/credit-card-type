.setup-pnpm-registry: &setup-pnpm-registry
  - pnpm config set "@${CI_PROJECT_ROOT_NAMESPACE}:registry" "${CI_API_V4_URL}/packages/npm/"
  - pnpm config set "${CI_API_V4_URL#https?}/packages/npm/:_authToken" "${CI_JOB_TOKEN}"
  - pnpm config set "${CI_API_V4_URL#https?}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken" "${CI_JOB_TOKEN}"

stages:
  - build
  - test
  - package

build:
  stage: build
  image:
    name: registry.mamis.com.au/mamis/containers/nodejs:20
  artifacts:
    expire_in: 7 days
    paths:
      - dist
      - node_modules
  script:
    - pnpm install
    - pnpm run build

test:unit:
  stage: test
  image:
    name: registry.mamis.com.au/mamis/containers/nodejs:20
  needs:
    - build
  script:
    - pnpm run test:unit

test:integration:
  stage: test
  image:
    name: registry.mamis.com.au/mamis/containers/nodejs:20
  needs:
    - build
  script:
    - pnpm run test:integration

npm-package:
  stage: package
  image:
    name: registry.mamis.com.au/mamis/containers/nodejs:20
  needs:
    - build
  only:
    - tags
  before_script:
    - *setup-pnpm-registry
  script:
    - pnpm version --no-git-tag-version ${CI_COMMIT_TAG}
    - pnpm publish
